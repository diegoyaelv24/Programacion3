    <p>Complete el siguiente formulario para programar una consulta presencial o virtual con nuestros especialistas.</p>

    <form>
        <label>Nombre completo:</label>
        <input type="text">

        <label>Teléfono de contacto:</label>
        <input type="tel">

        <label>Seleccione el área de interés:</label>
        <select>
            <option>Derecho Penal</option>
            <option>Derecho Civil</option>
            <option>Derecho Laboral</option>
            <option>Consultoría General</option>
        </select>

        <label>Fecha sugerida:</label>
        <input type="date">

        <button type="submit">Confirmar Cita</button>
    </form>
